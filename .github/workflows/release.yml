name: Docker-Image veröffentlichen

on:
  push:
    branches: [main]
  # Bei PRs (auch von Dependabot) nur bauen und pruefen, nicht pushen. So
  # faellt ein kaputtes Update vor dem Merge auf, nicht erst auf main.
  pull_request:
    branches: [main]
  schedule:
    # Woechentlicher Rebuild, damit Sicherheitsupdates des Basis-Images auch
    # ohne eigenen Commit ins Image kommen. Zeiten sind UTC. Die krumme
    # Minute ist Absicht: zur vollen Stunde starten sehr viele Workflows,
    # GitHub verzoegert oder verwirft Laeufe dann.
    # Hinweis: In oeffentlichen Repos deaktiviert GitHub geplante Workflows
    # nach 60 Tagen ohne Repo-Aktivitaet (Mail vorab, Reaktivierung per Klick).
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  # Neuer Push auf einen PR bricht dessen alten Test-Build ab; Veroeffent-
  # lichungen auf main laufen dagegen immer zu Ende.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Build und Push (linux/arm64)
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    # Nativer ARM-Runner statt QEMU-Emulation: Zielhost ist ein Raspberry Pi 5.
    # Fuer oeffentliche Repos kostenlos und um ein Vielfaches schneller.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: An der GitHub Container Registry anmelden
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Fest in Kleinbuchstaben: der Repo-Name "invoiceWatcher" enthaelt
          # Grossbuchstaben, die GHCR in Image-Namen nicht erlaubt.
          images: ghcr.io/${{ github.repository_owner }}/invoicewatcher
          # latest = aktueller main-Stand, sha-... = unveraenderlicher Zeiger
          # fuer Rollback, Datum = Merker fuer die geplanten Rebuilds.
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ env.PUSH == 'true' }}
          # Bei PRs ins lokale Docker laden, damit der Smoke-Test es starten kann.
          load: ${{ env.PUSH != 'true' }}
          # Ohne pull wuerde der geplante Lauf das alte Basis-Image aus dem
          # Cache nehmen und waere damit sinnlos.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Damit der Watcher beim Start ausgeben kann, aus welchem Commit
          # das laufende Image gebaut wurde.
          build-args: |
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test (Abhängigkeiten importierbar)
        if: env.PUSH != 'true'
        # invoice_watcher.py selbst braucht beim Import Zugangsdaten, daher
        # die Pakete aus requirements.txt (inkl. PyMuPDF/lxml mit nativen
        # Bibliotheken) und die übrigen Module direkt importieren.
        run: >
          docker run --rm --entrypoint python
          ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          -c "import imapclient, certifi, facturx, lxml, pymupdf, PIL, qrcode, dotenv, openai;
          import epc_qr, invoice_parser, llm_extractor, mailer; print('ok')"
