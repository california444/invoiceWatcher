[pytest]
testpaths = tests
addopts = -ra
# Deprecations als Fehler behandeln: so fällt ein veralteter API-Aufruf
# schon beim Dependabot-PR auf und nicht erst, wenn die Bibliothek ihn im
# nächsten Major-Release entfernt. Warnungen, die nicht auf unseren Code
# zurückgehen, unten gezielt ausnehmen. Spätere Einträge haben Vorrang.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning
    # Rauschen aus den SWIG-Bindings von PyMuPDF
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
